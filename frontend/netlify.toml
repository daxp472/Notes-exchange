# ==============================================================================
# Netlify Configuration for College Notes Exchange
# Supports: React Router SPA routing, asset caching, security headers
# ==============================================================================

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Production environment variables default
[build.environment]
  NODE_VERSION = "20"

# Caching & Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=86400"

# SPA Fallback Redirect - Reroutes all sub-paths to index.html with 200 OK
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
